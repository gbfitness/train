<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Train</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFF2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1A21" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Train">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --paper:#EFF2EE; --card:#FFFFFF; --ink:#12232E; --ink2:#52626D; --line:#D3DAD6;
  --run:#D93F5B; --lift:#4F46B8; --ride:#0C8F9B; --amber:#E9A400; --go:#1C9B57;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#0E1A21; --card:#16262F; --ink:#E9EFEC; --ink2:#9BABB4; --line:#284049;
    --run:#F0607B; --lift:#8A83F0; --ride:#2CC0CD; --amber:#F0B429; --go:#34C77B; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));}
.wrap{max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 18px 24px}
h1,h2,.serif{font-family:ui-serif,"New York",Georgia,serif}
h1{font-size:36px;line-height:1.05;margin:0 0 4px;font-weight:700;letter-spacing:-.02em}
h2{font-size:22px;line-height:1.15;margin:0;font-weight:650;letter-spacing:-.01em}
h3{font-size:15px;margin:22px 0 8px;font-weight:700}
.sub{color:var(--ink2);font-size:14px}
.note{color:var(--ink2);font-size:14px;margin-top:2px}
button{font-family:inherit;color:inherit}
.btn{appearance:none;border:0;border-radius:14px;padding:15px 18px;font-size:17px;font-weight:700;
  background:var(--ink);color:var(--paper);width:100%;margin-top:10px}
.btn.lift{background:var(--lift);color:#fff}.btn.run{background:var(--run);color:#fff}
.btn.ride{background:var(--ride);color:#fff}.btn.go{background:var(--go);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1.5px solid var(--run);color:var(--run)}
.link{appearance:none;background:none;border:0;padding:12px 0;font-size:15px;font-weight:600;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.small{appearance:none;border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:8px 14px;font-size:15px;font-weight:650}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;appearance:none;background:none;border:0;padding:6px 0;font-size:11.5px;font-weight:650;
  color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button[aria-current="true"]{color:var(--c)}
nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* today: hero */
.hero{border-radius:22px;padding:22px 20px 16px;color:#fff;margin-top:16px}
.hero.run{background:#D93F5B}.hero.lift{background:#4F46B8}.hero.bike{background:#0A7F8A}
.hero.rest{background:#52626D}
.hero.done{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.hero .hl{font-size:14px;font-weight:650;opacity:.9}
.hero .ht{font:700 52px/1.02 ui-serif,"New York",Georgia,serif;letter-spacing:-.02em;margin:4px 0 8px}
.hero.done .ht{font-size:34px}
.hero .hd{font-size:17px;font-weight:600}
.hero .hn{font-size:14px;opacity:.92;margin-top:6px}
.hero .hbtn{appearance:none;border:0;border-radius:14px;padding:16px 18px;font-size:18px;font-weight:700;
  width:100%;margin-top:18px;background:#fff;color:#12232E}
.hero .hsec{display:flex;gap:20px;margin-top:6px;flex-wrap:wrap}
.hero .hsec button{appearance:none;background:none;border:0;padding:12px 0 4px;font-size:15px;font-weight:650;
  color:inherit;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.chips .note{margin:0 4px 0 0}
.chip{appearance:none;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);
  border-radius:999px;padding:9px 14px;font-size:15px;font-weight:650}

/* week strip + calendar */
.stripbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:26px}
.stripbar .sub{flex:1;text-align:center}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 6px}
button.day{appearance:none;background:none;color:inherit;font:inherit;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:8px 0 7px;border-radius:12px;border:1.5px solid transparent}
button.day.now{border-color:var(--ink2)}
button.day.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dl{font-size:12px;color:var(--ink2);font-weight:650}
button.day.sel .dl{color:var(--paper);opacity:.8}
.dn{font:650 18px ui-serif,"New York",Georgia,serif}
.dots{display:flex;gap:3px;height:10px;align-items:center}
.d{width:8px;height:8px;border-radius:50%;display:block}
.d.run{background:var(--run)}.d.lift{background:var(--lift)}.d.ride{background:var(--ride)}
.d.plan{background:transparent}
.d.plan.run{border:1.5px solid var(--run)}.d.plan.lift{border:1.5px solid var(--lift)}.d.plan.ride{border:1.5px solid var(--ride)}
.d.plan.race{border-width:2.5px;width:10px;height:10px}
.d.rest{width:9px;height:2px;border-radius:1px;background:var(--ink2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:12px 0 4px}
.cal .ch{font-size:12px;color:var(--ink2);text-align:center;font-weight:650;padding:4px 0}
.cell{appearance:none;background:none;color:inherit;border:1.5px solid transparent;border-radius:12px;padding:6px 0 5px;
  display:flex;flex-direction:column;align-items:center;gap:4px;min-height:54px;font:650 17px ui-serif,"New York",Georgia,serif}
.cell.today{background:var(--line)}
.cell.sel{border-color:var(--ink)}
.cell.blank{visibility:hidden}

/* lifting */
.exrow,.exhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.exrow{padding:14px 0;border-top:1px solid var(--line)}
.exname{font:650 20px ui-serif,"New York",Georgia,serif}
.wt{appearance:none;background:none;border:0;border-bottom:2px dotted var(--ink2);padding:2px 0;
  font:700 30px/1 ui-serif,"New York",Georgia,serif;font-variant-numeric:tabular-nums lining-nums}
.wt small{font:600 14px -apple-system,system-ui,sans-serif;color:var(--ink2)}
.ex{padding:18px 0 20px;border-top:1px solid var(--line)}
.sets{display:flex;gap:10px;margin-top:14px}
.set{appearance:none;width:54px;height:54px;border-radius:50%;border:2.5px solid var(--lift);background:transparent;
  color:var(--lift);font:700 21px ui-serif,"New York",Georgia,serif;display:grid;place-items:center;padding:0}
.set[aria-pressed="true"]{background:var(--lift);color:#fff}
.rest{position:sticky;top:0;z-index:10;margin:-4px -18px 8px;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
  background:var(--ink);color:var(--paper);transition:background .25s}
.rest.amber{background:var(--amber);color:#1B1300}
.rest.go{background:var(--go);color:#fff}
.rest .time{font:700 46px/1 ui-serif,"New York",Georgia,serif;font-variant-numeric:tabular-nums lining-nums}
.rest .msg{font-size:14px;margin-top:6px;opacity:.95}
.track{position:relative;height:8px;border-radius:4px;background:rgba(127,127,127,.35);margin-top:12px}
.fill{height:100%;border-radius:4px;background:currentColor;width:0}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:currentColor;opacity:.7;left:60%}
.marks{position:relative;height:16px;font-size:12px;font-weight:650;margin-top:6px;opacity:.85}
.marks span{position:absolute;transform:translateX(-50%)}

/* running */
.prow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}
.prow b{font:650 19px ui-serif,"New York",Georgia,serif}
.prow.done b{color:var(--go)}
.done-line{font-size:14px;font-weight:650;color:var(--go);margin-top:4px}
details{border-top:1px solid var(--line)}
summary{list-style:none;padding:14px 0;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary .wn{font:650 18px ui-serif,"New York",Georgia,serif}
.meter{height:6px;border-radius:3px;background:var(--line);margin:10px 0 4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--run)}

/* stats + lists */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.stat{padding:12px 0;border-top:2px solid var(--ride)}
.stat .n{font:700 30px/1 ui-serif,"New York",Georgia,serif;font-variant-numeric:tabular-nums lining-nums}
.stat .l{font-size:13px;color:var(--ink2);margin-top:4px}
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.item .bar{width:5px;align-self:stretch;border-radius:3px;flex:none}
.item .body{flex:1;min-width:0}
.item .h{font-weight:700}
.item .x{color:var(--ink2);font-size:14px;margin-top:2px}
.item .x span{margin-right:12px;white-space:nowrap}
.item .del{appearance:none;background:none;border:0;color:var(--ink2);font-size:14px;padding:4px 0 4px 8px;text-decoration:underline}
.empty{padding:22px 0;color:var(--ink2)}

.banner{position:relative;aspect-ratio:3/1;min-height:100px;max-height:150px;border-radius:18px;overflow:hidden;margin:0 0 16px;background:#12232E}
.banner svg,.banner img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.banner img{object-fit:cover}

/* celebrations */
.set.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1),ring .7s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(138,131,240,.6)}100%{box-shadow:0 0 0 20px rgba(138,131,240,0)}}
.ex.win{animation:win 1.2s ease-out}
@keyframes win{0%{background:transparent}20%{background:rgba(28,155,87,.16)}100%{background:transparent}}
.exdone{color:var(--go);font-size:15px;font-weight:700;margin-top:10px}
.btn.pulse{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.03);box-shadow:0 0 0 7px rgba(28,155,87,.25)}}
#fx{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:70}
.cheer{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));z-index:71;transform:translateX(-50%);
  background:var(--go);color:#fff;padding:12px 18px;border-radius:14px;font:700 18px/1.2 ui-serif,"New York",Georgia,serif;
  box-shadow:0 10px 24px rgba(0,0,0,.22);pointer-events:none;white-space:nowrap;animation:cheer 2s ease-out forwards}
.cheer.big{font-size:26px;padding:16px 24px;background:var(--lift)}
@keyframes cheer{0%{opacity:0;transform:translate(-50%,16px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-16px)}}
.lslink{display:inline-block;margin-top:10px;font-size:14px;font-weight:700;color:inherit;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion: reduce){.set.pop,.ex.win,.btn.pulse{animation:none}.cheer{animation:cheerfade 2s linear forwards}}
@keyframes cheerfade{0%,80%{opacity:1}100%{opacity:0}}

/* rehab */
.menu{display:flex;align-items:center;gap:14px;width:100%;appearance:none;text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:16px;color:var(--ink)}
.menu .mt{font:650 19px ui-serif,"New York",Georgia,serif}
.menu .mdots{display:flex;gap:5px;margin-left:auto;align-items:center}
.areas{display:flex;gap:8px;margin:16px 0 4px}
.area{appearance:none;flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 0;font-size:15px;font-weight:700}
.area[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.rcard{margin-top:12px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);overflow:hidden}
.rfig{display:block;width:100%;height:auto;aspect-ratio:5/3;background:var(--paper)}
.rbody{padding:16px 18px 18px}
.rdose{display:inline-block;margin-top:10px;padding:7px 11px;border-radius:10px;background:var(--paper);font-weight:700;font-size:15px}
.rbody ol{margin:12px 0 0;padding-left:22px}.rbody li{margin:7px 0}
.rnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.rdots{display:flex;gap:6px}.rdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.rdots i.on{background:var(--ink)}

/* analytics */
.acard{margin-top:12px;padding:14px 14px 10px;border:1.5px solid var(--line);border-radius:18px;background:var(--card)}
.ahead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:6px}
.ahead .at{font:650 19px/1.15 ui-serif,"New York",Georgia,serif}
.ahead .av{font:700 26px/1 ui-serif,"New York",Georgia,serif;font-variant-numeric:tabular-nums lining-nums;text-align:right}
.ahead .av small{font:600 13px -apple-system,system-ui,sans-serif;color:var(--ink2)}
.achart{display:block;width:100%;height:auto;overflow:visible}
.achart text{font:10.5px -apple-system,system-ui,sans-serif;fill:var(--ink2)}
.amini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.amini b{display:block;font:700 20px/1.1 ui-serif,"New York",Georgia,serif;font-variant-numeric:tabular-nums lining-nums}
.amini span{font-size:12.5px;color:var(--ink2)}
.akey{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:2px 0 4px}
.akey i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.aempty{padding:16px 0 10px;color:var(--ink2);font-size:14px}

/* goal card */
.goal{margin-top:26px;border-radius:24px;overflow:hidden;color:#fff;background:#12232E}
.sky{position:relative;height:232px;padding:18px 20px 0;overflow:hidden;
  background:linear-gradient(180deg,#2A2878 0%,#A8327F 50%,#EE5F45 80%,#F7B23B 100%)}
.sun{position:absolute;left:50%;bottom:-66px;width:132px;height:132px;margin-left:-66px;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#FFF0B8 0%,#FFCB5C 60%,#FFA83A 100%);
  box-shadow:0 0 0 12px rgba(255,214,120,.22),0 0 0 26px rgba(255,214,120,.10)}
.gtitle{position:relative;font:650 23px/1.1 ui-serif,"New York",Georgia,serif}
.gdate{position:relative;font-size:14px;margin-top:3px;opacity:.92}
.grow{position:relative;display:flex;justify-content:space-between;align-items:flex-start;margin-top:14px}
.gnum{font:700 84px/.9 ui-serif,"New York",Georgia,serif;letter-spacing:-.03em;font-variant-numeric:lining-nums}
.gnum.sm{font-size:58px}
.glab{font-size:15px;font-weight:650;margin-top:8px}
.bib{position:relative;width:112px;background:#FFF8EC;color:#12232E;border-radius:6px;padding:12px 10px 10px;
  text-align:center;transform:rotate(4deg);box-shadow:0 8px 16px rgba(20,10,40,.4);margin-right:2px}
.bib .h{position:absolute;width:6px;height:6px;border-radius:50%;background:#A8327F;opacity:.55}
.bib .h.a{left:6px;top:6px}.bib .h.b{right:6px;top:6px}.bib .h.c{left:6px;bottom:6px}.bib .h.d{right:6px;bottom:6px}
.bib .bn{font:700 38px/1 ui-serif,"New York",Georgia,serif;margin-top:6px}
.bib .bt{font:700 25px/1 ui-serif,"New York",Georgia,serif}
.bib .bl{font-size:12px;font-weight:650;color:#52626D}
.bib hr{border:0;border-top:1.5px dashed #C9C2B4;margin:7px 0}
.ground{padding:14px 20px 18px}
.road{position:relative;height:8px;border-radius:4px;background:rgba(255,255,255,.18);margin:22px 4px 0 0}
.road>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#A8327F,#F7B23B)}
.runner{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;
  display:grid;place-items:center;box-shadow:0 0 0 4px rgba(255,255,255,.22)}
.flag{position:absolute;right:-3px;top:-24px;width:20px;height:20px}
.flag svg{display:block}
.rl{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;opacity:.8;margin-top:10px}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.gstats b{display:block;font:700 22px/1.1 ui-serif,"New York",Georgia,serif;font-variant-numeric:lining-nums}
.gstats span{font-size:12.5px;opacity:.75}
.lane .bar{width:5px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;background:rgba(8,18,24,.55)}
#sheet.on{display:flex}
.panel{width:100%;max-width:520px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;
  padding:22px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.panel label{display:block;font-size:14px;font-weight:650;margin-top:14px}
.panel input,.panel textarea{display:block;width:100%;margin-top:6px;padding:12px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:17px;font-family:inherit}
.panel textarea{height:180px;font:13px/1.35 ui-monospace,Menlo,monospace}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pace{margin-top:12px;font:650 20px ui-serif,"New York",Georgia,serif;min-height:26px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:650;z-index:60;max-width:90%}
@media (prefers-reduced-motion: reduce){ .rest{transition:none} }
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--lift);outline-offset:2px}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<nav id="nav" aria-label="Sections">
  <button data-act="tab" data-tab="today" style="--c:var(--ink)"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Today</button>
  <button data-act="tab" data-tab="lift" style="--c:var(--lift)"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Lift</button>
  <button data-act="tab" data-tab="run" style="--c:var(--run)"><svg viewBox="0 0 24 24"><circle cx="14.5" cy="4.5" r="1.8"/><path d="M5 21l4-6 3 1.5 1.5-5-3-1.2-3.5 3M13.5 10.5l3 2.5 3-.8M12 16.5l2 4.5"/></svg>Run</button>
  <button data-act="tab" data-tab="ride" style="--c:var(--ride)"><svg viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-8h5l3 8M10 8H8M12.5 12l-2.5 4"/></svg>Ride</button>
  <button data-act="tab" data-tab="history" style="--c:var(--ink)"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>History</button>
</nav>
<div id="sheet" role="dialog" aria-modal="true"></div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
var KEY='train.v1';                      // same key as before, so existing data still loads
var RACE=new Date(2027,0,31);            // Sunday, Jan 31, 2027
var RACE_S='2027-01-31';
var ANCHOR_S='2026-09-28';               // the day the rotation starts: bike (already done)
var ROT=['bike','lift','run','lift'];    // the 4-day rotation; lift alternates A/B by itself
var TYPES={bike:{name:'Bike',css:'ride'},lift:{name:'Lift',css:'lift'},run:{name:'Run',css:'run'}};
var LIFTS={squat:'Squat',bench:'Bench press',row:'Barbell row',ohp:'Overhead press',deadlift:'Deadlift'};
var WORKOUTS={A:['squat','bench','row'],B:['squat','ohp','deadlift']};
var SETS={squat:5,bench:5,row:5,ohp:5,deadlift:1};
var KEYS=Object.keys(LIFTS);

var E='Easy', L='Long', T='Steady';
var NOTES={
  Easy:'Easy, conversational effort. Around 9:00 per mile or slower is fine. Effort matters more than the number.',
  Long:'Slow and steady, about 9:00 per mile (8:45 to 9:30 is fine). Walk breaks are fine.'
};
/* 31 runs, one per run day in the rotation. Long runs land about every 8 days. */
var PLAN=[
  [E,3],[L,4],[E,3],[L,4.5],[E,3.5],[L,5],[E,3],[L,4,'Cutback long run. Keep it easy.'],
  [E,3.5],[L,6],
  [T,4,'Steady: 4 miles total, middle 2 miles at about 8:30.'],[L,6.5],
  [T,4,'Middle 2 miles at about 8:20.'],[L,7],
  [T,4.5,'Middle 2.5 miles at about 8:15.'],[L,5.5,'Cutback long run. Keep it easy.'],
  [T,4,'Relaxed: middle 2 miles at about 8:15.'],[L,8],
  [T,5,'Middle 3 miles at about 8:10.'],[L,9],
  [T,5,'Middle 3 miles at about 8:05.'],[L,10],
  [T,5.5,'Middle 3 miles at goal pace, 8:00.'],[L,11],
  [T,6,'Middle 4 miles at goal pace, 8:00.'],
  [L,12,'Longest run of the plan. Easy pace, about 9:00. Walk breaks are fine.'],
  [T,5,'Middle 3 miles at goal pace, 8:00.'],
  [L,9,'Step-down long run. Easy pace.'],
  [T,4,'Middle 2 miles at goal pace, 8:00. Short and sharp.'],
  [L,6,'Last long run before the race. Easy pace.'],
  [E,2,'Shakeout: 2 easy miles, loose and relaxed.']
];
var RACE_NOTE='Goal pace 8:00 per mile, about a 1:45 finish. Go out a little slower for the first 2 miles.';

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return ymd(new Date());}
function parseYmd(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function mid(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function weekStart(d){var x=mid(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function fmtDate(s){return parseYmd(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function fmtShort(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtDur(s){s=Math.round(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+pad(m)+':'+pad(x):m+':'+pad(x);}
function fmtNum(n){return String(+Number(n).toFixed(2));}
function fmtW(w){return fmtNum(w);}
function paceOf(mi,secs){if(!(mi>0)||!(secs>0))return '';var p=Math.round(secs/mi);return Math.floor(p/60)+':'+pad(p%60);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:NaN;}
function inWeek(dateStr,ws){var d=parseYmd(dateStr);return d>=ws&&d<addDays(ws,7);}
function tomorrowS(){return ymd(addDays(new Date(),1));}
function isPlanId(id){return /^r\d+$/.test(id||'');}

/* ---------- state ---------- */
function initPtr(d){
  // Where the rotation stands, worked out from the latest logged activity.
  var last=null;
  function see(type,x){if(!last||x.date>last.date||(x.date===last.date&&(x.at||0)>=last.at))last={type:type,date:x.date,at:x.at||0,letter:x.type};}
  d.lifts.forEach(function(x){see('lift',x);});
  d.runs.forEach(function(x){see('run',x);});
  d.rides.forEach(function(x){see('bike',x);});
  if(last){if(last.type==='bike')return 1;if(last.type==='run')return 3;return last.letter==='B'?0:2;}
  return today()<=ANCHOR_S?0:1;
}
function seedBike(d){
  // You said the rotation starts with the bike ride you did on Sep 28, so it is logged as done (delete it in History if not).
  if(!d.rides.some(function(r){return r.date===ANCHOR_S;}))d.rides.push({id:'seed-bike',date:ANCHOR_S,mins:0,kj:0,at:0});
}
function fresh(){
  var w={},i={};KEYS.forEach(function(k){w[k]=45;i[k]=5;});w.deadlift=95;
  var d={v:2,settings:{weights:w,inc:i,next:'A',lastExport:null,lockTimer:{on:false,name:'Train Rest'}},lifts:[],runs:[],rides:[],rests:[],rot:{ptr:0},active:null};
  seedBike(d);d.rot.ptr=initPtr(d);return d;
}
function coerce(o){
  if(!o||typeof o!=='object')throw new Error('bad');
  var d=fresh(),s=o.settings||{},re=/^\d{4}-\d{2}-\d{2}$/;
  d.rides=[];                              // fresh() seeded one; rebuild from the data instead
  KEYS.forEach(function(k){
    var w=Number(s.weights&&s.weights[k]);if(isFinite(w)&&w>=0)d.settings.weights[k]=w;
    var i=Number(s.inc&&s.inc[k]);if(isFinite(i)&&i>=0)d.settings.inc[k]=i;
  });
  d.settings.next=s.next==='B'?'B':'A';
  d.settings.lastExport=typeof s.lastExport==='number'?s.lastExport:null;
  var lt=s.lockTimer||{};d.settings.lockTimer={on:!!lt.on,name:(typeof lt.name==='string'&&lt.name.trim())?lt.name.trim().slice(0,60):'Train Rest'};
  d.lifts=(Array.isArray(o.lifts)?o.lifts:[]).filter(function(l){return l&&re.test(String(l.date));}).map(function(l){
    return {id:String(l.id||uid()),date:String(l.date),type:l.type==='B'?'B':'A',at:Number(l.at)||0,dur:Number(l.dur)||0,
      ex:(Array.isArray(l.ex)?l.ex:[]).filter(function(e){return e&&LIFTS[e.k];}).map(function(e){
        return {k:e.k,w:Number(e.w)||0,done:(Array.isArray(e.done)?e.done:[]).map(Boolean)};})};});
  d.runs=(Array.isArray(o.runs)?o.runs:[]).filter(function(r){return r&&re.test(String(r.date))&&Number(r.miles)>0;}).map(function(r){
    var pid=r.planId?String(r.planId):null;if(pid&&!isPlanId(pid)&&pid!=='race')pid=null;   // old week-based ids become extra runs
    return {id:String(r.id||uid()),date:String(r.date),miles:Number(r.miles),secs:Number(r.secs)||0,planId:pid,at:Number(r.at)||0};});
  d.rides=(Array.isArray(o.rides)?o.rides:[]).filter(function(r){return r&&re.test(String(r.date));}).map(function(r){
    return {id:String(r.id||uid()),date:String(r.date),mins:Number(r.mins)||0,kj:Number(r.kj)||0,at:Number(r.at)||0};});
  d.rests=(Array.isArray(o.rests)?o.rests:[]).filter(function(x){return re.test(String(x));}).map(String);
  if((Number(o.v)||1)<2)seedBike(d);
  var rp=o.rot?Number(o.rot.ptr):NaN;
  d.rot={ptr:(isFinite(rp)&&rp>=0&&rp<4)?Math.floor(rp):initPtr(d)};
  var a=o.active;
  if(a&&Array.isArray(a.ex)&&a.ex.every(function(e){return e&&LIFTS[e.k]&&Array.isArray(e.done);})){
    d.active={type:a.type==='B'?'B':'A',startedAt:Number(a.startedAt)||Date.now(),date:re.test(String(a.date))?a.date:today(),
      rest:a.rest?Number(a.rest):null,ex:a.ex.map(function(e){return {k:e.k,w:Number(e.w)||0,done:e.done.map(Boolean)};})};
  }
  return d;
}
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw)return coerce(JSON.parse(raw));}catch(e){}
  return fresh();
}
var S=load();
var ui={tab:'today',open:{},confirm:null,sheet:null,sel:null,week:null,cal:null,rehab:{area:'ankle',i:0}};
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){toast('Could not save. Storage may be full or blocked.');}
}

/* ---------- rotation ---------- */
function nearest(type,from){for(var d=0;d<4;d++){var i=(from+d)%4;if(ROT[i]===type)return i;}return from;}
function recent(ds){return ds===today()||ds===ymd(addDays(new Date(),-1));}
function advance(type,dateStr){
  // Continue the rotation from the step that was just done (only for activity from today or yesterday).
  if(!recent(dateStr))return;
  S.rot.ptr=(nearest(type,S.rot.ptr)+1)%4;
}
function doneTypesOn(ds){
  var t=[];
  if(S.lifts.some(function(x){return x.date===ds;}))t.push('lift');
  if(S.runs.some(function(x){return x.date===ds;}))t.push('run');
  if(S.rides.some(function(x){return x.date===ds;}))t.push('bike');
  return t;
}
function consumed(ds){return doneTypesOn(ds).length>0||S.rests.indexOf(ds)>=0;}
function firstFree(){var n=mid(new Date());return consumed(ymd(n))?addDays(n,1):n;}
function clearRest(ds){S.rests=S.rests.filter(function(x){return x!==ds;});}

/* ---------- plan lookups ---------- */
function planRun(idx){
  if(idx>=0&&idx<PLAN.length){var p=PLAN[idx];return {t:p[0],mi:p[1],note:p[2]||NOTES[p[0]]||''};}
  return {t:'Easy',mi:3,note:NOTES.Easy};
}
function runTitle(idx){return idx<PLAN.length?'Run '+(idx+1)+' of '+PLAN.length:'Extra run';}
function planById(id){
  if(id==='race')return {idx:-1,t:'Race',mi:13.1,note:'Miami Half Marathon. '+RACE_NOTE};
  var m=/^r(\d+)$/.exec(id||'');if(!m)return null;
  var idx=+m[1]-1;if(idx<0||idx>=PLAN.length)return null;
  var r=planRun(idx);return {idx:idx,t:r.t,mi:r.mi,note:r.note};
}
function doneRun(id){return S.runs.filter(function(r){return r.planId===id;})[0]||null;}
function lastDoneIdx(){
  var m=-1;S.runs.forEach(function(r){if(isPlanId(r.planId))m=Math.max(m,+r.planId.slice(1)-1);});return m;
}
function weekMiles(ws){return S.runs.filter(function(r){return inWeek(r.date,ws);}).reduce(function(a,r){return a+r.miles;},0);}

/* What is due on each future day, if you follow the rotation with no more rest days.
   Runs are matched to the plan counting back from race day, so the long runs and taper land before Jan 31. */
var proj=null;
function buildProj(){
  var ff=firstFree(),days={},slots=[],ptr=S.rot.ptr,letter=S.settings.next,off=0,d;
  for(d=ff;d<RACE;d=addDays(d,1),off++){
    var step=ROT[(ptr+off)%4],e={step:step};
    if(step==='lift'){e.letter=letter;letter=letter==='A'?'B':'A';}
    if(step==='run')slots.push(ymd(d));
    days[ymd(d)]=e;
  }
  if(ff<=RACE)days[RACE_S]={step:'race'};
  var N=PLAN.length,M=slots.length,base=Math.max(N-M,lastDoneIdx()+1);
  slots.forEach(function(ds,j){days[ds].runIdx=base+j;});
  return {days:days,slots:slots,base:base,M:M,ff:ff};
}
function nextRunPlanId(){return proj.base<PLAN.length?'r'+(proj.base+1):'';}

function dayInfo(ds){
  return {done:doneTypesOn(ds),rest:S.rests.indexOf(ds)>=0,plan:proj.days[ds]||null,race:ds===RACE_S};
}
function describe(p,withW){
  if(p.step==='bike')return {t:'Bike',l:'Log your ride when you are done. Minutes and output are optional.'};
  if(p.step==='lift'){
    var ks=WORKOUTS[p.letter];
    return {t:'Lift '+p.letter,l:ks.map(function(k){return LIFTS[k].toLowerCase()+(withW?' '+fmtW(S.settings.weights[k]):'');}).join(', ')+(withW?' (lb)':'')};
  }
  if(p.step==='run'){var r=planRun(p.runIdx);return {t:'Run',l:runTitle(p.runIdx)+': '+r.t+', '+fmtNum(r.mi)+' miles',n:r.note};}
  return {t:'Race day',l:'Miami Half Marathon, 13.1 miles',n:RACE_NOTE};
}
function shortDesc(p){
  if(p.step==='bike')return 'Bike';
  if(p.step==='lift')return 'Lift '+p.letter;
  if(p.step==='run'){var r=planRun(p.runIdx);return runTitle(p.runIdx)+' ('+r.t+', '+fmtNum(r.mi)+' mi)';}
  return 'the race';
}
function heroCls(step){return step==='bike'?'bike':step==='lift'?'lift':'run';}

/* ---------- views: today ---------- */
function markers(info){
  var h='';
  info.done.forEach(function(t){h+='<i class="d '+TYPES[t].css+'"></i>';});
  if(info.rest)h+='<i class="d rest"></i>';
  if(!info.done.length&&!info.rest&&info.plan){
    var s=info.plan.step;h+='<i class="d plan '+(s==='bike'?'ride':s==='lift'?'lift':'run')+(s==='race'?' race':'')+'"></i>';
  }
  return h;
}
function todayState(ts){
  if(S.active)return {kind:'active'};
  var acts=doneTypesOn(ts);if(acts.length)return {kind:'done',acts:acts};
  if(S.rests.indexOf(ts)>=0)return {kind:'rest'};
  var p=proj.days[ts];if(p)return {kind:'due',p:p};
  return {kind:'over'};
}
function heroHtml(st){
  var nxt=proj.days[tomorrowS()];
  if(st.kind==='active'){
    return '<section class="hero lift"><div class="hl">In progress</div><div class="ht">Lift '+S.active.type+'</div>'+
      '<div class="hd">Your workout is still open.</div><button class="hbtn" data-act="heroGo" data-step="lift">Resume workout</button></section>';
  }
  if(st.kind==='done'){
    var names=st.acts.map(function(t){return TYPES[t].name;}).join(' and ');
    return '<section class="hero done"><div class="hl">Done for today</div><div class="ht">'+names+' logged</div>'+
      (nxt?'<div class="hd">Up next: '+esc(shortDesc(nxt))+', tomorrow.</div>':'')+'</section>';
  }
  if(st.kind==='rest'){
    return '<section class="hero rest"><div class="hl">Day off</div><div class="ht">Rest day</div>'+
      '<div class="hd">Everything moves back one day.</div>'+(nxt?'<div class="hn">Tomorrow: '+esc(shortDesc(nxt))+'.</div>':'')+
      '<button class="hbtn" data-act="undoRest">Undo rest day</button></section>';
  }
  if(st.kind==='over'){
    return '<section class="hero done"><div class="hl">After the race</div><div class="ht">Plan complete</div>'+
      '<div class="hd">You can still log any activity below.</div></section>';
  }
  var p=st.p,dsc=describe(p,true);
  var btn=p.step==='lift'?'Start Lift '+p.letter:p.step==='run'?'Log run':p.step==='race'?'Log race':'Log ride';
  var plan=p.step==='run'?(p.runIdx<PLAN.length?'r'+(p.runIdx+1):''):p.step==='race'?'race':'';
  return '<section class="hero '+heroCls(p.step)+'"><div class="hl">Due today</div><div class="ht">'+esc(dsc.t)+'</div>'+
    '<div class="hd">'+esc(dsc.l)+'</div>'+(dsc.n?'<div class="hn">'+esc(dsc.n)+'</div>':'')+
    '<button class="hbtn" data-act="heroGo" data-step="'+p.step+'" data-plan="'+plan+'">'+btn+'</button>'+
    '<div class="hsec"><button data-act="rest">Rest today</button><button data-act="chooseDue">Change what\u2019s due</button></div></section>';
}
function chipsHtml(st){
  var list=[],label='Or do something else:';
  if(st.kind==='due'){
    if(st.p.step==='race')return '';
    list=['bike','lift','run'].filter(function(t){return t!==st.p.step;});
  }else if(st.kind==='done'){list=['bike','lift','run'];label='Log something else:';}
  else if(st.kind==='rest'||st.kind==='over'){list=['bike','lift','run'];label='Log an activity anyway:';}
  else return '';
  return '<div class="chips"><span class="note">'+label+'</span>'+list.map(function(t){
    return '<button class="chip" data-act="doOther" data-type="'+t+'"><i class="d '+TYPES[t].css+'"></i>'+TYPES[t].name+'</button>';}).join('')+'</div>';
}
function panelHtml(ds){
  var ts=today(),info=dayInfo(ds),title=fmtDate(ds);
  var back='<button class="link" data-act="backToday">Back to today</button>';
  if(ds>ts){
    if(!info.plan)return '<section class="hero done"><div class="hl">'+esc(title)+'</div><div class="ht">Nothing planned</div><div class="hd">The plan ends with the race.</div></section>'+back;
    var dsc=describe(info.plan,false);
    return '<section class="hero '+heroCls(info.plan.step)+'"><div class="hl">Due on '+esc(title)+'</div><div class="ht">'+esc(dsc.t)+'</div>'+
      '<div class="hd">'+esc(dsc.l)+'</div>'+(dsc.n?'<div class="hn">'+esc(dsc.n)+'</div>':'')+
      '<div class="hn">This assumes no more rest days or switches. If you rest or change activity, the schedule moves.</div></section>'+back;
  }
  var items='';
  S.lifts.filter(function(x){return x.date===ds;}).forEach(function(x){items+=itemHtml('lift',x);});
  S.runs.filter(function(x){return x.date===ds;}).forEach(function(x){items+=itemHtml('run',x);});
  S.rides.filter(function(x){return x.date===ds;}).forEach(function(x){items+=itemHtml('ride',x);});
  if(info.rest)items+=itemHtml('rest',{id:ds,date:ds});
  return '<section class="hero done"><div class="hl">'+esc(title)+'</div><div class="ht">'+(items?'What you logged':'Nothing logged')+'</div></section>'+
    '<div style="margin-top:6px">'+items+'</div>'+back;
}
function stripHtml(){
  var now=new Date(),ts=ymd(now),ws=ui.week||weekStart(now),sel=ui.sel||ts,i,cells='';
  for(i=0;i<7;i++){
    var d=addDays(ws,i),ds=ymd(d),info=dayInfo(ds);
    var lab=fmtDate(ds)+(info.done.length?': '+info.done.map(function(t){return TYPES[t].name;}).join(', ')+' logged':info.rest?': rest day':info.plan?': '+shortDesc(info.plan)+' due':'');
    cells+='<button class="day'+(ds===ts?' now':'')+(ds===sel?' sel':'')+'" data-act="pick" data-d="'+ds+'" aria-label="'+esc(lab)+'">'+
      '<span class="dl">'+'MTWTFSS'[i]+'</span><span class="dn">'+d.getDate()+'</span><span class="dots">'+markers(info)+'</span></button>';
  }
  return '<div class="stripbar"><button class="small" data-act="weekShift" data-d="-1" aria-label="Previous week">\u2039</button>'+
    '<span class="sub">'+fmtShort(ws)+' to '+fmtShort(addDays(ws,6))+'</span>'+
    '<button class="small" data-act="weekShift" data-d="1" aria-label="Next week">\u203a</button>'+
    '<button class="small" data-act="openCal">Calendar</button></div>'+
    '<div class="strip">'+cells+'</div><div class="note">Filled dot: done. Hollow dot: coming up. Tap any day to see it.</div>';
}
function calSheet(){
  var ts=today(),sel=ui.sel||ts,c=ui.cal,first=new Date(c.y,c.m,1);
  var title=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  var lead=(first.getDay()+6)%7,dim=new Date(c.y,c.m+1,0).getDate(),cells='',i,day;
  for(i=0;i<lead;i++)cells+='<span class="cell blank"></span>';
  for(day=1;day<=dim;day++){
    var ds=ymd(new Date(c.y,c.m,day)),info=dayInfo(ds);
    cells+='<button class="cell'+(ds===ts?' today':'')+(ds===sel?' sel':'')+'" data-act="pick" data-d="'+ds+'" data-close="1" aria-label="'+esc(fmtDate(ds))+'">'+
      '<span>'+day+'</span><span class="dots">'+markers(info)+'</span></button>';
  }
  var hdr='MTWTFSS'.split('').map(function(x){return '<span class="ch">'+x+'</span>';}).join('');
  openSheet('<div class="exhead"><button class="small" data-act="calNav" data-d="-1" aria-label="Previous month">\u2039</button><h2>'+title+'</h2>'+
    '<button class="small" data-act="calNav" data-d="1" aria-label="Next month">\u203a</button></div>'+
    '<div class="cal">'+hdr+cells+'</div><div class="note">Filled dot: done. Hollow dot: coming up.</div>'+
    '<button class="btn ghost" data-act="close">Close</button>');
}
var RUNNER_SVG='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#D93F5B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="14.5" cy="4.5" r="1.8"/><path d="M5 21l4-6 3 1.5 1.5-5-3-1.2-3.5 3M13.5 10.5l3 2.5 3-.8M12 16.5l2 4.5"/></svg>';
var FLAG_SVG='<svg viewBox="0 0 20 20" width="20" height="20"><path d="M4 2v17" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M5 3h12v9H5z" fill="#fff"/><path d="M5 3h4v3H5zM13 3h4v3h-4zM9 6h4v3H9zM5 9h4v3H5zM13 9h4v3h-4z" fill="#12232E"/></svg>';
function goalHtml(){
  var td=mid(new Date()),start=parseYmd(ANCHOR_S);
  var days=Math.round((RACE-td)/864e5),total=Math.round((RACE-start)/864e5);
  var pct=Math.max(0,Math.min(100,Math.round((td-start)/864e5/total*100)));
  var doneN=S.runs.filter(function(r){return isPlanId(r.planId);}).length;
  var miles=S.runs.reduce(function(a,r){return a+r.miles;},0);
  var longest=S.runs.reduce(function(a,r){return Math.max(a,r.miles);},0);
  var rd=doneRun('race'),num,lab,cls='';
  if(days>0){num=String(days);lab=days===1?'day to go':'days to go';}
  else if(days===0){num='0';lab='Race day. Go get it.';}
  else{num='Done';cls=' sm';lab=(rd&&rd.secs)?'Finished in '+fmtDur(rd.secs):'Race complete';}
  var pctLab=pct+'% of the way';
  return '<section class="goal" aria-label="Race goal">'+
    '<div class="sky"><div class="sun"></div>'+
      '<div class="gtitle">Miami Half Marathon</div><div class="gdate">Sunday, Jan 31. Goal pace 8:00 per mile.</div>'+
      '<div class="grow"><div><div class="gnum'+cls+'">'+num+'</div><div class="glab">'+esc(lab)+'</div></div>'+
        '<div class="bib"><i class="h a"></i><i class="h b"></i><i class="h c"></i><i class="h d"></i>'+
        '<div class="bn">13.1</div><div class="bl">miles</div><hr><div class="bt">1:45</div><div class="bl">goal time</div></div></div>'+
    '</div>'+

/* ---------- views: lift ---------- */
function vLift(){
  var a=S.active;

  var t=S.settings.next,other=t==='A'?'B':'A';
  var rows=WORKOUTS[t].map(function(k){
    return '<div class="exrow"><div><div class="exname">'+LIFTS[k]+'</div><div class="sub">'+SETS[k]+(SETS[k]>1?' sets':' set')+' of 5 reps</div></div>'+
      '<button class="wt" data-act="editWeight" data-k="'+k+'" aria-label="Change '+LIFTS[k]+' weight">'+fmtW(S.settings.weights[k])+' <small>lb</small></button></div>';
  }).join('');

  return bannerHtml('lift')+'<h1>Lift</h1><div class="sub">'+(last?'Last workout: '+fmtDate(last.date)+' (Workout '+last.type+')':'No workouts yet. Tap a weight to change your starting weights.')+'</div>'+
    '<h3>Workout '+t+'</h3>'+rows+
    '<button class="btn lift" data-act="start">Start Workout '+t+'</button>'+
    '<button class="link" data-act="swap">Switch to Workout '+other+'</button>'+
    '<p class="note">Each finished exercise adds '+fmtNum(S.settings.inc.squat)+' lb next time. Exercises with unmarked sets stay at the same weight.</p>';
}
function workoutView(a){
  var all=a.ex.every(function(e){return e.done.every(Boolean);});
  var ex=a.ex.map(function(e,i){
    var sets=e.done.map(function(d,j){
      return '<button class="set" aria-pressed="'+d+'" aria-label="'+LIFTS[e.k]+' set '+(j+1)+' of '+e.done.length+', '+(d?'done':'not done')+'" data-act="set" data-i="'+i+'" data-j="'+j+'">5</button>';
    }).join('');
    return '<section class="ex"><div class="exhead"><h2>'+LIFTS[e.k]+'</h2>'+
      '<button class="wt" data-act="editWeight" data-i="'+i+'" aria-label="Change weight">'+fmtW(e.w)+' <small>lb</small></button></div>'+
      '<div class="sets">'+sets+'</div>'+(e.done.every(Boolean)?'<div class="exdone">Done.'+(S.settings.inc[e.k]?' +'+fmtNum(S.settings.inc[e.k])+' lb next time.':'')+'</div>':'')+'</section>';
  }).join('');
  return '<div class="rest" id="rest" role="timer"><div class="time">0:00</div><div class="msg"></div>'+
      '<div class="track"><div class="fill"></div><div class="tick"></div></div>'+
      '<div class="marks"><span style="left:60%">3:00</span><span style="left:calc(100% - 14px)">5:00</span></div>'+lockLink()+'</div>'+
    '<div class="exhead" style="margin-top:12px"><h1>Workout '+a.type+'</h1></div>'+ex+
    '<button class="btn '+(all?'go':'ghost')+'" data-act="finish">Finish workout</button>'+
    '<button class="link" data-act="cancelWorkout">Discard this workout</button>';
}

/* ---------- views: run ---------- */
function rowDate(idx){
  var d=doneRun('r'+(idx+1));if(d)return d.date;
  var j=idx-proj.base;if(j>=0&&j<proj.slots.length)return proj.slots[j];return null;
}
function planRow(idx){
  var id='r'+(idx+1),r=planRun(idx),d=doneRun(id),status='';
  if(d)status='<div class="done-line">Done '+fmtDate(d.date)+': '+fmtNum(d.miles)+' mi'+(d.secs?' in '+fmtDur(d.secs)+' ('+paceOf(d.miles,d.secs)+' per mile)':'')+'</div>';
  else if(idx<proj.base)status='<div class="note">Dropped to stay on schedule</div>';
  else{var dt=rowDate(idx);if(dt)status='<div class="note">Planned '+fmtDate(dt)+'</div>';}
  return '<div class="prow'+(d?' done':'')+'"><div style="flex:1;min-width:0"><b>Run '+(idx+1)+': '+r.t+', '+fmtNum(r.mi)+' mi</b>'+
    (PLAN[idx][2]?'<div class="note">'+esc(PLAN[idx][2])+'</div>':'')+status+'</div>'+
    '<button class="small" data-act="logRun" data-plan="'+id+'">'+(d?'Edit':'Log')+'</button></div>';
}
function vRun(){
  var N=PLAN.length,ws=weekStart(new Date()),base=proj.base,ts=today(),i;
  var doneN=S.runs.filter(function(r){return isPlanId(r.planId);}).length,dropped=0;
  for(i=0;i<base&&i<N;i++){if(!doneRun('r'+(i+1)))dropped++;}
  var next='';
  if(base<N&&proj.slots.length){
    var r=planRun(base),sd=proj.slots[0];
    next='<h3>Next run</h3><div class="prow"><div style="flex:1;min-width:0"><b>Run '+(base+1)+' of '+N+': '+r.t+', '+fmtNum(r.mi)+' mi</b>'+
      '<div class="note">'+esc(r.note)+'</div><div class="note">'+(sd===ts?'Due today.':'Due '+fmtDate(sd)+' if you follow the rotation.')+'</div></div>'+
      '<button class="small" data-act="logRun" data-plan="r'+(base+1)+'">Log</button></div>';
  }else if(base>=N){
    next='<p class="sub" style="margin-top:16px">You have reached the end of the plan. Log any extra run below.</p>';
  }
  var blocks='',b,end,rows,d0,d1,rng,key,open;
  for(b=0;b<N;b+=8){
    end=Math.min(N,b+8);rows='';for(i=b;i<end;i++)rows+=planRow(i);
    d0=rowDate(b);d1=rowDate(end-1);rng=(d0&&d1)?fmtShort(parseYmd(d0))+' to '+fmtShort(parseYmd(d1)):'';
    key='b'+b;open=ui.open[key]===undefined?(base>=b&&base<end):!!ui.open[key];
    blocks+='<details data-key="'+key+'"'+(open?' open':'')+'><summary><span class="wn">Runs '+(b+1)+' to '+end+'</span><span class="sub">'+rng+'</span></summary>'+rows+'</details>';
  }
  var rd=doneRun('race');
  var raceRow='<div class="prow"><div style="flex:1;min-width:0"><b>Race: Miami Half, 13.1 mi</b><div class="note">Sunday, Jan 31. '+esc(RACE_NOTE)+'</div>'+
    (rd?'<div class="done-line">Done: '+fmtNum(rd.miles)+' mi'+(rd.secs?' in '+fmtDur(rd.secs)+' ('+paceOf(rd.miles,rd.secs)+' per mile)':'')+'</div>':'')+'</div>'+
    '<button class="small" data-act="logRun" data-plan="race">'+(rd?'Edit':'Log')+'</button></div>';
  return bannerHtml('run')+'<h1>Run</h1><div class="sub">Miami Half Marathon, Sunday, Jan 31, 2027. Goal: 8:00 per mile, about 1:45.</div>'+
    '<div class="meter"><i style="width:'+Math.min(100,doneN/N*100)+'%"></i></div>'+
    '<div class="sub">'+doneN+' of '+N+' plan runs done. '+fmtNum(weekMiles(ws))+' miles logged this week. '+proj.M+' run days left before the race.</div>'+
    (dropped?'<p class="note" style="margin-top:8px">'+dropped+(dropped===1?' run was':' runs were')+' dropped so far. When rest days use up run days, the plan skips the earliest runs so your long runs and taper stay before race day.</p>':'')+
    next+
    '<button class="btn ghost" data-act="logRun" data-plan="">Log an extra run</button>'+
    '<h3>Full plan</h3>'+blocks+raceRow+
    '<p class="note" style="margin-top:18px">Dates assume you follow the rotation with no more rest days, so they move when you rest or switch. This is a general, gradual build-up, not coaching. If something hurts, skip the run and tell me.</p>';
}

/* ---------- views: ride, history ---------- */
function rideStats(from){
  var r=S.rides.filter(function(x){return !from||parseYmd(x.date)>=from;});
  var withKj=r.filter(function(x){return x.kj>0;});   // average only over rides where output was entered
  return {n:r.length,mins:r.reduce(function(a,x){return a+x.mins;},0),
    avgKj:withKj.length?withKj.reduce(function(a,x){return a+x.kj;},0)/withKj.length:0};
}
function vRide(){
  var now=new Date(),wk=rideStats(weekStart(now)),mo=rideStats(new Date(now.getFullYear(),now.getMonth(),1)),all=rideStats();
  function block(t,s){return '<div class="stat"><div class="n">'+s.n+'</div><div class="l">'+t+(s.avgKj?'<br>'+Math.round(s.avgKj)+' kJ average':'')+(s.mins?'<br>'+Math.round(s.mins)+' min':'')+'</div></div>';}
  var list=S.rides.slice().sort(function(a,b){return b.date.localeCompare(a.date)||b.at-a.at;}).slice(0,8).map(function(r){return itemHtml('ride',r);}).join('');
  return bannerHtml('ride')+'<h1>Ride</h1><div class="sub">One tap to log. Minutes and output are optional.</div>'+
    '<button class="btn ride" data-act="logRide">Log a ride</button>'+
    '<div class="stats">'+block('This week',wk)+block('This month',mo)+block('All time',all)+'</div>'+
    '<h3>Recent rides</h3>'+(list||'<div class="empty">No rides yet.</div>');
}
function itemHtml(kind,x){
  var c=kind==='lift'?'lift':kind==='run'?'run':kind==='ride'?'ride':'ink2',h,body='';
  if(kind==='lift'){
    h='Workout '+x.type;
    body='<div class="x">'+x.ex.map(function(e){
      var n=e.done.filter(Boolean).length;
      return '<span>'+LIFTS[e.k]+' '+fmtW(e.w)+' lb, '+n+'/'+e.done.length+'</span>';}).join('')+'</div>'+(x.dur?'<div class="x"><span>'+Math.round(x.dur/60)+' min</span></div>':'');
  }else if(kind==='run'){
    h=(x.planId==='race'?'Race, ':'Run, ')+fmtNum(x.miles)+' mi';
    body='<div class="x">'+(x.secs?'<span>'+fmtDur(x.secs)+'</span><span>'+paceOf(x.miles,x.secs)+' per mile</span>':'<span>No time logged</span>')+(isPlanId(x.planId)?'<span>Plan run '+x.planId.slice(1)+'</span>':'')+'</div>';
  }else if(kind==='ride'){
    h='Ride';
    body='<div class="x">'+((x.mins||x.kj)?(x.mins?'<span>'+fmtNum(x.mins)+' min</span>':'')+(x.kj?'<span>'+fmtNum(x.kj)+' kJ</span>':''):'<span>Logged</span>')+'</div>';
  }else{h='Rest day';body='<div class="x"><span>Schedule moved back a day</span></div>';}
  return '<div class="item"><span class="bar" style="background:var(--'+c+')"></span><div class="body"><div class="h">'+h+'</div><div class="x">'+fmtDate(x.date)+'</div>'+body+'</div>'+
    '<button class="del" data-act="del" data-kind="'+kind+'" data-id="'+esc(x.id)+'">Delete</button></div>';
}
function vHistory(){
  var items=[],count=0;

  S.runs.forEach(function(x){items.push(['run',x]);count++;});
  S.rides.forEach(function(x){items.push(['ride',x]);count++;});
  S.rests.forEach(function(ds){items.push(['rest',{id:ds,date:ds,at:0}]);});
  items.sort(function(a,b){return b[1].date.localeCompare(a[1].date)||(b[1].at||0)-(a[1].at||0);});
  var list=items.slice(0,150).map(function(p){return itemHtml(p[0],p[1]);}).join('');

      '<span class="mdots"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-7"/></svg><span aria-hidden="true" style="font-size:24px;margin-left:6px">\u203a</span></span></button>'+
    '<h3>Backup</h3>'+

function fmtPace(sec){sec=Math.round(sec);return Math.floor(sec/60)+':'+pad(sec%60);}
function tOf(ds){return parseYmd(ds).getTime();}
function weekList(dates){
  if(!dates.length)return [];
  var first=weekStart(parseYmd(dates.reduce(function(a,b){return a<b?a:b;}))),last=weekStart(new Date()),out=[],d;
  for(d=first;d<=last;d=addDays(d,7))out.push(d);
  return out;
}
function weekKey(ds){return ymd(weekStart(parseYmd(ds)));}
function niceStep(raw,steps){
  if(!(raw>0))return 1;
  if(steps){for(var i=0;i<steps.length;i++)if(steps[i]>=raw)return steps[i];return steps[steps.length-1];}
  var m=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),f=raw/m;
  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*m;
}
function chartSvg(o){
  var W=340,H=o.h||150,L=42,R=12,T=12,B=22,iw=W-L-R,ih=H-T-B,all=[];
  o.series.forEach(function(sr){sr.pts.forEach(function(q){all.push(q);});});
  if(!all.length)return '';
  var xs=all.map(function(q){return q[0];}),ys=all.map(function(q){return q[1];});
  if(o.goal)ys.push(o.goal.y);
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);if(x0===x1){x0-=3*864e5;x1+=3*864e5;}
  var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);if(y0===y1){y0-=Math.max(1,Math.abs(y0)*.05);y1+=Math.max(1,Math.abs(y1)*.05);}
  var pd=(y1-y0)*.14;y0-=pd;y1+=pd;if(o.floor!==undefined)y0=Math.max(o.floor,y0);
  function X(t){return L+(t-x0)/(x1-x0)*iw;}
  function Y(v){var f=(v-y0)/(y1-y0);return o.invert?T+f*ih:T+(1-f)*ih;}
  var g='',st=niceStep((y1-y0)/3,o.steps),v;
  for(v=Math.ceil(y0/st)*st;v<=y1+1e-9;v+=st){var yy=Y(v).toFixed(1);
    g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>'+
       '<text x="'+(L-6)+'" y="'+(+yy+3.5)+'" text-anchor="end">'+esc(o.yFmt(v))+'</text>';}
  g+='<text x="'+L+'" y="'+(H-5)+'">'+esc(fmtShort(new Date(x0)))+'</text><text x="'+(W-R)+'" y="'+(H-5)+'" text-anchor="end">'+esc(fmtShort(new Date(x1)))+'</text>';
  if(o.goal){var gy=Y(o.goal.y).toFixed(1);
    g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--go)" stroke-width="1.5" stroke-dasharray="5 4"/>'+
       '<text x="'+(W-R)+'" y="'+(+gy-4)+'" text-anchor="end" style="fill:var(--go);font-weight:700">'+esc(o.goal.label)+'</text>';}
  o.series.forEach(function(sr){
    var pts=sr.pts.slice().sort(function(a,b){return a[0]-b[0];});
    if(sr.line&&pts.length>1)g+='<path d="'+pts.map(function(q,n){return (n?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1);}).join('')+
      '" fill="none" stroke="'+sr.color+'" stroke-width="'+(sr.width||2.5)+'" stroke-linejoin="round" stroke-linecap="round"'+(sr.opacity?' opacity="'+sr.opacity+'"':'')+'/>';
    if(sr.dots)pts.forEach(function(q){var hol=q[2]===false;
      g+='<circle cx="'+X(q[0]).toFixed(1)+'" cy="'+Y(q[1]).toFixed(1)+'" r="'+(sr.r||3.5)+'" fill="'+(hol?'var(--card)':sr.color)+'" stroke="'+sr.color+'" stroke-width="'+(hol?2:0)+'"'+(sr.opacity&&!sr.line?' opacity="'+sr.opacity+'"':'')+'/>';});
  });
  return '<svg class="achart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Chart')+'">'+g+'</svg>';
}
function barSvg(o){
  var W=340,H=o.h||140,L=42,R=12,T=18,B=22,iw=W-L-R,ih=H-T-B,n=o.bars.length;
  if(!n)return '';
  var mx=Math.max.apply(null,o.bars.map(function(b){return b.v;}).concat([o.minMax||1])),y1=mx*1.12,g='',st=niceStep(y1/3.2,o.steps),v;
  function Y(v){return T+(1-v/y1)*ih;}
  for(v=st;v<=y1+1e-9;v+=st){var yy=Y(v).toFixed(1);
    g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(+yy+3.5)+'" text-anchor="end">'+esc(o.yFmt(v))+'</text>';}
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ih)+'" y2="'+(T+ih)+'" stroke="var(--line)" stroke-width="1.5"/>';
  var slot=iw/n,bw=Math.max(3,Math.min(26,slot*.68)),cur=ymd(weekStart(new Date()));
  o.bars.forEach(function(b,i){
    var x=L+slot*i+(slot-bw)/2,y=Y(b.v),h=T+ih-y,isCur=ymd(b.t)===cur;
    if(b.v>0)g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,h).toFixed(1)+'" rx="3" fill="'+o.color+'"'+(isCur?' opacity=".5"':'')+'/>';
    if((n<=10||i===n-1)&&b.v>0)g+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" style="fill:var(--ink);font-weight:700">'+esc(b.lab!==undefined?b.lab:o.yFmt(b.v))+'</text>';
  });
  g+='<text x="'+L+'" y="'+(H-5)+'">'+esc(fmtShort(o.bars[0].t))+'</text><text x="'+(W-R)+'" y="'+(H-5)+'" text-anchor="end">'+esc(fmtShort(o.bars[n-1].t))+'</text>';
  return '<svg class="achart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Chart')+'">'+g+'</svg>';

function aCard(title,val,body){return '<div class="acard"><div class="ahead"><div class="at">'+title+'</div>'+(val?'<div class="av">'+val+'</div>':'')+'</div>'+body+'</div>';}

/* ---------- rest timer ---------- */
function tick(){
  var el=document.getElementById('rest');if(!el||!S.active)return;
  var a=S.active,all=a.ex.every(function(e){return e.done.every(Boolean);});
  var t=el.querySelector('.time'),m=el.querySelector('.msg'),f=el.querySelector('.fill');
  el.classList.remove('amber','go');
  if(!a.rest){t.textContent='0:00';m.textContent='Mark a set when you finish it. The rest timer starts then.';f.style.width='0';return;}
  var s=Math.max(0,Math.floor((Date.now()-a.rest)/1000));
  t.textContent=fmtDur(s);f.style.width=Math.min(100,s/300*100)+'%';
  if(s>=300){el.classList.add('go');m.textContent=all?'5 minutes reached. All sets are done.':'5 minutes reached.';}
  else if(s>=180){el.classList.add('amber');m.textContent='3 minutes reached. Go when you feel ready.';}
  else m.textContent=all?'All sets are done. Finish the workout when ready.':'Resting. 3:00 is the minimum.';
}

  try{
    if(!('wakeLock' in navigator))return;
    if(S.active&&ui.tab==='lift'&&document.visibilityState==='visible'){
      if(!wake){wake='pending';navigator.wakeLock.request('screen').then(function(l){wake=l;l.addEventListener('release',function(){wake=null;});}).catch(function(){wake=null;});}
    }else if(wake&&wake!=='pending'){wake.release();wake=null;}

}

function exportSheet(){
  var json=JSON.stringify(S,null,1);
  openSheet('<h2>Back up data</h2><div class="note">Copy this text and paste it into Notes, Files, or an email to yourself. To restore later, paste it back under Restore from backup.</div>'+
    '<textarea id="f-json" readonly>'+esc(json)+'</textarea>'+
    '<button class="btn" data-act="copyExport">Copy to clipboard</button>'+
    (navigator.share?'<button class="btn ghost" data-act="shareExport">Share or save as file\u2026</button>':'')+
    '<button class="btn ghost" data-act="close">Close</button>');
}

/* ---------- actions ---------- */
function markExported(){S.settings.lastExport=Date.now();save();}
function startLift(){if(S.active){ui.tab='lift';render();window.scrollTo(0,0);}else A.start();}
var A={
  tab:function(d){ui.tab=d.tab;if(d.tab==='today'){ui.sel=null;ui.week=null;}window.scrollTo(0,0);render();},
  close:function(){closeSheet();},
  confirmOk:function(){var f=ui.confirm;closeSheet();if(f)f();},

  /* today screen */
  heroGo:function(d){
    if(d.step==='lift')startLift();
    else if(d.step==='run')runSheet(d.plan||'');
    else if(d.step==='race')runSheet('race');
    else rideSheet();
  },
  doOther:function(d){
    if(d.type==='bike')rideSheet();
    else if(d.type==='run')runSheet(nextRunPlanId());
    else startLift();
  },
  rest:function(){var ts=today();if(S.rests.indexOf(ts)<0)S.rests.push(ts);save();render();},
  undoRest:function(){clearRest(today());save();render();},
  chooseDue:function(){
    openSheet('<h2>What should be due next?</h2><div class="note">The rotation continues from your choice. Use this to fix the schedule or skip an activity.</div>'+
      '<button class="btn ride" data-act="setDue" data-type="bike">Bike</button>'+
      '<button class="btn lift" data-act="setDue" data-type="lift">Lift</button>'+
      '<button class="btn run" data-act="setDue" data-type="run">Run</button>'+
      '<button class="btn ghost" data-act="close">Cancel</button>');
  },
  setDue:function(d){S.rot.ptr=nearest(d.type,S.rot.ptr);save();closeSheet();render();},
  pick:function(d){
    ui.sel=(d.d===today())?null:d.d;ui.week=weekStart(parseYmd(d.d));
    if(d.close)closeSheet();
    render();
  },
  backToday:function(){ui.sel=null;ui.week=null;render();},
  weekShift:function(d){ui.week=addDays(ui.week||weekStart(new Date()),7*Number(d.d));render();},
  openCal:function(){var b=parseYmd(ui.sel||today());ui.cal={y:b.getFullYear(),m:b.getMonth()};calSheet();},
  calNav:function(d){var c=ui.cal,x=new Date(c.y,c.m+Number(d.d),1);ui.cal={y:x.getFullYear(),m:x.getMonth()};calSheet();},

  /* rehab */
  rehabArea:function(d){ui.rehab={area:d.area,i:0};render();},
  rehabNav:function(d){var n=rehabList().length;ui.rehab.i=((ui.rehab.i+Number(d.d))%n+n)%n;render();},

  /* lock-screen timer link */
  lockSheet:function(){
    var lt=S.settings.lockTimer;
    openSheet('<h2>Lock-screen rest timer</h2>'+
      '<div class="note">A web app cannot put its own timer on the lock screen. When this is on, the rest timer shows a link that runs an iPhone Shortcut, and the Shortcut starts a Clock timer. Clock timers do show on the lock screen.</div>'+
      '<ol class="note" style="padding-left:20px;margin-top:10px"><li>Open the Shortcuts app and tap +.</li><li>Add the Clock action that starts a timer, and set it to 3 minutes.</li>'+
      '<li>Name the shortcut exactly as below.</li><li>Don\u2019t add a step that opens this app\u2019s web address. That opens Safari, which keeps separate data.</li></ol>'+
      '<label for="f-sc">Shortcut name</label><input id="f-sc" value="'+esc(lt.name)+'">'+
      '<button class="btn" data-act="saveLock" data-on="1">'+(lt.on?'Save':'Turn on')+'</button>'+
      (lt.on?'<button class="btn danger" data-act="saveLock" data-on="0">Turn off</button>':'')+
      '<button class="btn ghost" data-act="close">Cancel</button>');
  },
  saveLock:function(d){
    var v=(document.getElementById('f-sc').value||'').trim()||'Train Rest';
    S.settings.lockTimer={on:d.on==='1',name:v.slice(0,60)};save();closeSheet();render();
    toast(d.on==='1'?'Lock-screen timer link is on.':'Lock-screen timer link is off.');
  },

  /* lifting */
  swap:function(){S.settings.next=S.settings.next==='A'?'B':'A';save();render();},
  start:function(){
    var t=S.settings.next;
    S.active={type:t,startedAt:Date.now(),date:today(),rest:null,
      ex:WORKOUTS[t].map(function(k){var d=[];for(var i=0;i<SETS[k];i++)d.push(false);return {k:k,w:S.settings.weights[k],done:d};})};
    ui.tab='lift';save();render();window.scrollTo(0,0);
  },
  set:function(d){
    var a=S.active;if(!a)return;var i=+d.i,e=a.ex[i],j=+d.j;e.done[j]=!e.done[j];
    if(e.done[j])a.rest=Date.now();
    else if(!a.ex.some(function(x){return x.done.some(Boolean);}))a.rest=null;
    save();render();
    if(e.done[j])celebrate(i,j);
  },
  editWeight:function(d){
    if(d.i!==undefined&&S.active){var e=S.active.ex[+d.i];ui.sheet={kind:'w',i:+d.i};weightSheet(LIFTS[e.k],e.w);}
    else{ui.sheet={kind:'w',k:d.k};weightSheet(LIFTS[d.k],S.settings.weights[d.k]);}
  },
  wstep:function(d){
    var inp=document.getElementById('f-w'),v=num(inp.value);if(!isFinite(v))v=0;
    inp.value=fmtW(Math.max(0,v+Number(d.d)));
  },
  saveWeight:function(){
    var v=num(document.getElementById('f-w').value);
    if(!isFinite(v)||v<0){toast('Enter a weight in pounds.');return;}
    var s=ui.sheet;
    if(s.i!==undefined&&S.active)S.active.ex[s.i].w=v;else S.settings.weights[s.k]=v;
    save();closeSheet();render();
  },
  finish:function(){
    var a=S.active;if(!a)return;
    var all=a.ex.every(function(e){return e.done.every(Boolean);});
    var go=function(){
      var rec={id:uid(),date:a.date,type:a.type,at:Date.now(),dur:Math.round((Date.now()-a.startedAt)/1000),
        ex:a.ex.map(function(e){return {k:e.k,w:e.w,done:e.done.slice()};})};
      if(!rec.ex.some(function(e){return e.done.some(Boolean);})){toast('No sets were marked, so nothing was saved.');S.active=null;save();render();return;}
      S.lifts.push(rec);
      a.ex.forEach(function(e){S.settings.weights[e.k]=e.done.every(Boolean)?e.w+S.settings.inc[e.k]:e.w;});
      S.settings.next=a.type==='A'?'B':'A';
      advance('lift',a.date);clearRest(a.date);
      S.active=null;ui.tab='today';ui.sel=null;ui.week=null;save();render();window.scrollTo(0,0);toast('Workout saved.');
    };
    if(all)go();else ask('Some sets are not marked. Save anyway? Those exercises keep the same weight next time.','Save workout',go);
  },
  cancelWorkout:function(){ask('Discard this workout? Nothing will be saved.','Discard',function(){S.active=null;save();render();},true);},

  /* running */
  logRun:function(d){runSheet(d.plan||'');},
  saveRun:function(){
    var mi=num(document.getElementById('f-mi').value),secs=readTime(),date=document.getElementById('f-date').value;
    if(!(mi>0)){toast('Enter the distance in miles.');return;}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast('Pick a date.');return;}
    var s=ui.sheet,ex=s.id?S.runs.filter(function(r){return r.id===s.id;})[0]:null;
    if(ex){ex.miles=mi;ex.secs=secs;ex.date=date;}
    else{S.runs.push({id:uid(),date:date,miles:mi,secs:secs,planId:s.planId||null,at:Date.now()});advance('run',date);}
    clearRest(date);
    save();closeSheet();render();
  },
  delRunFromSheet:function(){
    var id=ui.sheet&&ui.sheet.id;
    ask('Delete this run?','Delete',function(){S.runs=S.runs.filter(function(r){return r.id!==id;});save();render();},true);
  },

  /* riding */
  logRide:function(){rideSheet();},
  saveRide:function(){
    var date=document.getElementById('f-date').value,m=num(document.getElementById('f-rmin').value),k=num(document.getElementById('f-kj').value);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast('Pick a date.');return;}
    S.rides.push({id:uid(),date:date,mins:isFinite(m)&&m>0?m:0,kj:isFinite(k)&&k>0?k:0,at:Date.now()});
    advance('bike',date);clearRest(date);
    save();closeSheet();render();
  },

  /* history + settings */
  del:function(d){
    var msg=d.kind==='lift'?'Delete this workout? Your next-workout weights will not change.':
      d.kind==='rest'?'Delete this rest day?':'Delete this entry? The rotation will not move back. Use Change what\u2019s due on Today if needed.';
    ask(msg,'Delete',function(){
      if(d.kind==='lift')S.lifts=S.lifts.filter(function(x){return x.id!==d.id;});
      if(d.kind==='run')S.runs=S.runs.filter(function(x){return x.id!==d.id;});
      if(d.kind==='ride')S.rides=S.rides.filter(function(x){return x.id!==d.id;});
      if(d.kind==='rest')S.rests=S.rests.filter(function(x){return x!==d.id;});
      save();render();
    },true);
  },
  incSheet:function(){
    ui.sheet={kind:'inc'};
    openSheet('<h2>Weight added after each lift</h2><div class="note">Added to an exercise next time, when every set of it was marked done.</div>'+
      '<label for="f-inc">Pounds</label><input id="f-inc" inputmode="decimal" value="'+fmtNum(S.settings.inc.squat)+'">'+
      '<button class="btn" data-act="saveInc">Save</button><button class="btn ghost" data-act="close">Cancel</button>');
  },
  saveInc:function(){
    var v=num(document.getElementById('f-inc').value);
    if(!isFinite(v)||v<0){toast('Enter a number of pounds.');return;}
    KEYS.forEach(function(k){S.settings.inc[k]=v;});save();closeSheet();render();
  },
  exportData:function(){exportSheet();},
  copyExport:function(){
    var ta=document.getElementById('f-json'),text=ta.value;
    var ok=function(){markExported();toast('Copied.');};
    var fallback=function(){ta.removeAttribute('readonly');ta.select();ta.setSelectionRange(0,text.length);
      try{if(document.execCommand('copy'))ok();else toast('Press and hold the text to copy it.');}catch(e){toast('Press and hold the text to copy it.');}
      ta.setAttribute('readonly','');};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(ok,fallback);else fallback();
  },
  shareExport:function(){
    var text=document.getElementById('f-json').value,name='train-backup-'+today()+'.json';
    try{
      var file=new File([text],name,{type:'application/json'});
      var p=(navigator.canShare&&navigator.canShare({files:[file]}))?navigator.share({files:[file],title:name}):navigator.share({title:name,text:text});
      p.then(markExported).catch(function(){});
    }catch(e){toast('Sharing is not available. Use Copy instead.');}
  },
  importData:function(){
    openSheet('<h2>Restore from backup</h2><div class="note">Paste the backup text below. This replaces everything currently on this phone.</div>'+
      '<textarea id="f-json" placeholder="Paste backup text here"></textarea>'+
      '<button class="btn" data-act="doImport">Restore</button><button class="btn ghost" data-act="close">Cancel</button>');
  },
  doImport:function(){
    var text=document.getElementById('f-json').value.trim(),data;
    try{data=coerce(JSON.parse(text));}catch(e){toast('That text is not a valid backup.');return;}
    ask('Replace everything on this phone with this backup ('+(data.lifts.length+data.runs.length+data.rides.length)+' activities)?','Replace data',function(){
      S=data;S.active=null;save();render();toast('Backup restored.');
    },true);
  }
};

document.addEventListener('click',function(e){
  if(e.target===sheetEl){closeSheet();return;}
  var el=e.target.closest('[data-act]');if(!el)return;
  var f=A[el.dataset.act];if(f)f(el.dataset,el);
});
document.addEventListener('input',function(e){
  var id=e.target&&e.target.id;
  if(id==='f-mi'||id==='f-min'||id==='f-sec')updatePace();
});
document.addEventListener('toggle',function(e){
  var d=e.target;if(d&&d.dataset&&d.dataset.key!==undefined){ui.open[d.dataset.key]=d.open?1:0;}
},true);

/* ---------- start ---------- */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js');}catch(e){}
if(S.active)ui.tab='lift';
render();
})();
</script>
</body>
</html>
